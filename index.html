.lab line{stroke:var(--c);stroke-width:3;stroke-linecap:round}

const T0=Math.min(...M.map(m=>m.pts[0].t)), T1=Math.max(...M.map(m=>m.last.t));

/* ---------- chart ---------- */
const box=$('#chart'), tip=$('#tip');
function nice(lo,hi,n){const raw=(hi-lo)/n||1,mag=10**Math.floor(Math.log10(raw)),f=raw/mag,step=(f<1.5?1:f<3?2:f<7?5:10)*mag;

function runs(pts,x,y,val,flag,gap){
  const out=[];let cur=null;
  for(let i=0;i<pts.length;i++){
    const p=pts[i],v=val(p);
    if(v==null){cur=null;continue}
    const d=!!flag(p);
    if(!cur||cur.dash!==d){cur={dash:d,d:`M${x(p.t).toFixed(1)} ${y(v).toFixed(1)}`};out.push(cur)}
    const q=pts[i+1]; if(!q) break;

    const qv=val(q);
    cur.d+=`H${x(q.t).toFixed(1)}`+(qv==null?'':`V${y(qv).toFixed(1)}`);

function inView(pts,t0){let k=0;for(let i=0;i<pts.length;i++)if(pts[i].t<=t0)k=i;return pts.slice(k)}
// the bundle-inclusive line is dotted wherever a bundle-only card sets the price

function draw(anim){
  const W=box.clientWidth, H=Math.round(clamp(innerHeight*.5,270,440)), narrow=W<560;
  const m=S.model, B=S.basis, O=B==='buy'?'incl':'buy', ml=2, mt=20, mb=24, mr=m?(narrow?66:90):(narrow?84:122);
  const t1=T1, t0=RANGES[S.range]?Math.max(T0,T1-RANGES[S.range]):T0, pw=W-ml-mr, ph=H-mt-mb;
  const x=t=>ml+(t-t0)/(t1-t0)*pw;
  let lo,hi,body='',labs='',fy;

    // a model no longer on sale may run off the top rather than flatten everything that still is

    M.forEach(s=>inView(s.pts,t0).forEach(p=>{if(!p[B])return;const v=p[B].min/s.msrp-1;all.push(v);if(s.st[B].cur)live.push(v)}));
    const cap=live.length?Math.max(...live)*1.25:Infinity;
    hi=Math.max(.1,...all.filter(v=>v<=cap)); lo=Math.min(0,...all);
    hi+=(hi-lo)*.07; lo-=(hi-lo)*.04; fy=fP;
  }else{
    lo=Infinity; hi=-Infinity;
    inView(m.pts,t0).forEach(p=>{for(const b in BASES)if(p[b]){lo=Math.min(lo,p[b].min);hi=Math.max(hi,p[b].min)}if(p[B])hi=Math.max(hi,p[B].max)});
    [sku,pre].forEach(s=>{if(s)s.pts.forEach(p=>{if(p.t>=t0){lo=Math.min(lo,p.v);hi=Math.max(hi,p.v)}})});
    if(!isFinite(lo)){lo=m.msrp;hi=m.msrp*1.5}
    if(m.msrp>=lo*.5) lo=Math.min(lo,m.msrp);
    const pad=(hi-lo||hi*.1)*.07; hi+=pad; lo-=pad; fy=fk;
  }
  const y=v=>mt+(hi-v)/(hi-lo)*ph;

  let grid='';
  nice(lo,hi,narrow?4:5).forEach(v=>{const Y=y(v).toFixed(1);const z=!m&&v===0;
    grid+=`<line class="${z?'z':''}" x1="${ml}" x2="${W-mr}" y1="${Y}" y2="${Y}"/><text class="tk y" x="${ml+2}" y="${Y-5}">${z?'建議售價':fy(v)}</text>`});
  let xt='';const d0=new Date(t0*864e5);let yy=d0.getUTCFullYear(),mo=d0.getUTCMonth();
  const perMo=pw/((t1-t0)/30.44), every=[1,2,3,6,12].find(k=>k*perMo>=(narrow?40:50))||12;
  for(;;){mo++;if(mo>11){mo=0;yy++}const t=Date.UTC(yy,mo,1)/864e5;if(t>t1)break;const X=x(t);
    if(mo%every||X<ml+26)continue;
    xt+=`<line x1="${X}" x2="${X}" y1="${H-mb}" y2="${H-mb+4}"/><text class="tk" x="${X}" y="${H-6}" text-anchor="middle"${mo?'':' style="fill:var(--ink);font-weight:500"'}>${mo?mo+1+'月':yy}</text>`}

  if(!m){

    for(let i=1;i<L.length;i++)if(L[i].y-L[i-1].y<gapY)L[i].y=L[i-1].y+gapY;
    const over=L[L.length-1].y-(H-mb-2);if(over>0){L[L.length-1].y-=over;for(let i=L.length-2;i>=0;i--)if(L[i+1].y-L[i].y<gapY)L[i].y=L[i+1].y-gapY}
    L.forEach(({s,st,y:Y,off})=>{labs+=`<g class="lab${st.cur?'':' none'}" data-i="${s.i}" style="--c:${s.c}" tabindex="0" role="button" aria-label="${s.id}">
      <rect x="${W-mr+2}" y="${Y-8}" width="${mr-2}" height="16"/><line x1="${W-mr+8}" x2="${W-mr+16}" y1="${Y}" y2="${Y}"/>
      <text x="${W-mr+22}" y="${Y+4}">${s.short}${narrow?'':`<tspan dx="6">${st.cur?(off?'↑ ':'')+fP(st.prem):none(s)}</tspan>`}</text></g>`});

    if(m.msrp>=lo){const yM=Y(m.msrp);grid+=`<line class="msrp" x1="${ml}" x2="${W-mr}" y1="${yM}" y2="${yM}"/>`;
      labs+=`<text class="note" x="${W-mr-4}" y="${yM-5}" text-anchor="end">建議售價 ${f$(m.msrp)}</text>`}
    const st=m.st[B], ot=m.st[O];

      labs+=`<circle class="low" cx="${lx}" cy="${ly}" r="4.5"/><text class="note" x="${lx+(a==='end'?-8:8)}" y="${ly+15}" text-anchor="${a}">史低 <tspan style="font-weight:700;fill:var(--ink)">${f$(st.low[B].min)}</tspan></text>`}
    const end=(s,b)=>s.lastV&&s.endT>=t0?{x:x(s.endT),y:y(s.lastV[b].min),v:s.lastV[b].min}:null;
    const e=end(st,B), oe=end(ot,O);

      if(e&&(Math.abs(sy-e.y)>15||sx<W-mr-40))labs+=`<circle class="end" style="--c:${m.c}" cx="${e.x}" cy="${e.y}" r="4"/>`;
    }else{

        labs+=`<circle class="end sub" style="--c:${m.c}" cx="${oe.x}" cy="${oe.y}" r="3.5"/><text class="note" x="${Math.min(oe.x+8,W-mr+8)}" y="${oe.y+4}">${narrow?'':BASES[O]+' '}${f$(oe.v)}</text>`;
      if(e)labs+=`<circle class="end" style="--c:${m.c}" cx="${e.x}" cy="${e.y}" r="4"/><text class="val" x="${Math.min(e.x+8,W-mr+8)}" y="${e.y+4}">${f$(e.v)}</text>`;

    <defs><clipPath id="cp"><rect class="reveal" x="${ml}" y="${mt-10}" width="${pw+6}" height="${ph+14}"/></clipPath></defs>
    <g class="g">${grid}${xt}</g><g clip-path="url(#cp)">${body}</g><g id="hov"></g>${labs}</svg>`);
  const ts=new Set();(m?[m]:M).forEach(s=>s.pts.forEach(p=>{if(p.t>=t0)ts.add(p.t)}));
  ctx={W,H,ml,mr,mt,mb,pw,ph,t0,t1,x,y,lo,hi,ts:[...ts].sort((a,b)=>a-b)};

}

function hover(px,py){

  if(px<c.ml-6||px>c.W-c.mr+6||py<0||py>c.H){leave();return}
  const tt=c.t0+(px-c.ml)/c.pw*(c.t1-c.t0);let t=c.ts[0];for(const v of c.ts)if(Math.abs(v-tt)<Math.abs(t-tt))t=v;
  const X=c.x(t);let h=`<line class="xh" x1="${X}" x2="${X}" y1="${c.mt-6}" y2="${c.H-c.mb}"/>`,html=`<h4>${fD(t)}</h4>`;
  if(!m){
    const rows=M.map(s=>{const st=valAt(s,t,B);return st&&{s,v:st.min/s.msrp-1,min:st.min}}).filter(Boolean).sort((a,b)=>b.v-a.v);
    let best=null,bd=26;rows.forEach(r=>{const Y=clamp(c.y(r.v),c.mt-8,c.H-c.mb);const d=Math.abs(Y-py);if(d<bd){bd=d;best=r.s.i}
      if(r.v<=c.hi)h+=`<circle class="hd" cx="${X}" cy="${c.y(r.v)}" r="4" fill="${r.s.c}"/>`});
    if(ptype==='mouse'&&best!==hot)setHot(best);
    html+=rows.length?rows.map(r=>`<div class="r${r.s.i===hot?' hot':''}"><i style="--c:${r.s.c}"></i><span>${r.s.short}</span><b>${fP(r.v)}</b><span>${f$(r.min)}</span></div>`).join('')
      :`<div class="s">${B==='buy'?'無單買':'無現貨'}</div>`;
  }else{
    const p=at(m.pts,t);if(!p){leave();return}
    const row=(b,on)=>`<div class="r${on?' hot':''}"><i style="--c:${m.c}"></i><span>${BASES[b]}</span><b>${p[b]?f$(p[b].min):'—'}</b><span>${p[b]?fP(p[b].min/m.msrp-1):''}</span></div>`;
    for(const b of [B==='buy'?'incl':'buy',B])if(p[b])h+=`<circle class="hd" cx="${X}" cy="${c.y(p[b].min)}" r="${b===B?4.5:3.5}" fill="${m.c}"/>`;
    html+=row('buy',B==='buy')+row('incl',B==='incl')+(p[B]?`<div class="r"><i></i><span>最高</span><b>${f$(p[B].max)}</b><span></span></div>`:'');
    const s=S.sku!=null?m.skus[S.sku]:null;
    if(s){const di=DI.get(t),sp=at(s.pts,t);if(sp&&di!=null&&di-sp.di<=2){h+=`<circle class="hd" cx="${X}" cy="${c.y(sp.v)}" r="4.5" fill="var(--ink)"/>`;
      html+=`<div class="r hot"><i style="--c:var(--ink)"></i><span>此款</span><b>${f$(sp.v)}</b><span>${sp.f===1?'限搭機':sp.f?'缺貨':''}</span></div>`}}
    html+=`<div class="s">${p.buy?'可單買 '+p.buy.n+' 款':'無單買'}${p.incl&&(!p.buy||p.incl.n!==p.buy.n)?' · 含搭機 '+p.incl.n+' 款':''}</div>`;
  }
  hv.innerHTML=h;tip.innerHTML=html;tip.classList.add('show');
  const tw=tip.offsetWidth,th=tip.offsetHeight;
  tip.style.left=(X+16+tw>c.W-c.mr?Math.max(0,X-16-tw):X+16)+'px';tip.style.top=clamp(py-th/2,0,c.H-th)+'px';
}
function leave(){const hv=box.querySelector('#hov');if(hv)hv.innerHTML='';tip.classList.remove('show');if(!S.model)setHot(null)}
box.addEventListener('pointermove',e=>{ptype=e.pointerType||'mouse';
  const lab=e.target.closest&&e.target.closest('.lab');
  if(lab){const hv=box.querySelector('#hov');if(hv)hv.innerHTML='';tip.classList.remove('show');setHot(+lab.dataset.i);return}
  const r=box.getBoundingClientRect();hover(e.clientX-r.left,e.clientY-r.top)});
box.addEventListener('pointerdown',e=>{ptype=e.pointerType||'mouse';if(ptype!=='mouse'){const r=box.getBoundingClientRect();hover(e.clientX-r.left,e.clientY-r.top)}});
box.addEventListener('pointerleave',leave);
box.addEventListener('click',e=>{if(S.model)return;const lab=e.target.closest('.lab');
  if(lab){go(M[+lab.dataset.i]);return} if(ptype==='mouse'&&hot!=null)go(M[hot])});
box.addEventListener('keydown',e=>{const lab=e.target.closest('.lab');if(lab&&(e.key==='Enter'||e.key===' ')){e.preventDefault();go(M[+lab.dataset.i])}});

const seg=$('#range');
seg.innerHTML=Object.keys(RANGES).map(k=>`<button data-r="${k}">${k}</button>`).join('');
seg.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.range=b.dataset.r;syncRange();draw(true)});
function syncRange(){seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.r===S.range))}

/* ---------- listings of one model ---------- */
const sec=$('#skus'), strip=$('#strip'), rows=$('#rows'), filters=$('#filters'), tip2=$('#tip2');
let dots=[];
const shown=()=>{const m=S.model;return m.skus.filter(s=>(S.gone||s.cur)&&(!S.brand||s.brand===S.brand))
  .sort((a,b)=>(b.cur-a.cur)||(a.cur?a.last.v-b.last.v:b.last.t-a.last.t))};
function spark(s){
  const w=strip.clientWidth<560?64:96,x=t=>1+(t-T0)/(T1-T0)*(w-2),y=v=>s.hi===s.lo?11:19-(v-s.lo)/(s.hi-s.lo)*16;
  return `<svg width="${w}" height="22" viewBox="0 0 ${w} 22">${runs(s.pts,x,y,p=>p.v,()=>0,true).replace(/class="ln"/g,'')}</svg>`;
}
function renderSkus(){
  const m=S.model;sec.hidden=!m;if(!m)return;
  const cur=m.skus.filter(s=>s.cur), gone=m.skus.length-cur.length;
  $('#stitle').textContent=m.stale?`最後掛牌 ${fD(m.listed)} · ${cur.length} 款`:`現有 ${cur.length} 款`;
  const brands=SK.brands.filter(b=>m.skus.some(s=>s.brand===b&&(S.gone||s.cur)));
  filters.innerHTML=`<button data-b="" aria-pressed="${!S.brand}">全部</button>`+brands.map(b=>`<button data-b="${esc(b)}" aria-pressed="${S.brand===b}">${esc(b)}</button>`).join('')
    +(gone?`<button data-g="1" aria-pressed="${S.gone}">已下架 ${gone}</button>`:'');
  const list=shown();
  rows.innerHTML=list.length?list.map(s=>{const res=!s.cur||s.last.f, out=s.cur&&s.last.f===2;
    return `<button class="row${s.k===S.sku?' on':''}${s.cur?'':' gone'}" data-k="${s.k}" style="--c:${m.c}" aria-pressed="${s.k===S.sku}">
      <span class="d${res?' o':''}${out?' x':''}"></span><span class="t" title="${esc(s.name)}"><b>${esc(s.brand)}</b>${esc(s.name.replace(s.brand,'').replace(/RTX\s?50\d0(?:\s?Ti)?\s+/i,'').trim())}</span>${spark(s)}
      <span class="v">${s.cur?f$(s.last.v):'~'+fD(s.last.t)}</span></button>`}).join(''):'<div class="empty">沒有符合的款式</div>';
  drawStrip();
}
function drawStrip(){
  const m=S.model;if(!m)return;const old=strip.querySelector('svg');if(old)old.remove();dots=[];
  const cur=m.skus.filter(s=>s.cur).sort((a,b)=>a.last.v-b.last.v);if(!cur.length)return;
  const W=strip.clientWidth,r=W<560?5:6.5,pitch=2*r+2,ml=r+4,mr=r+4;
  let lo=cur[0].last.v,hi=cur[cur.length-1].last.v;if(hi===lo){lo*=.97;hi*=1.03}
  const x=v=>ml+(v-lo)/(hi-lo)*(W-ml-mr);let maxo=0;
  cur.forEach(s=>{const X=x(s.last.v);let o=0;
    for(let k=0;;k++){const c=[k*pitch/2,-k*pitch/2].find(q=>!dots.some(d=>(d.x-X)**2+(d.o-q)**2<pitch*pitch-.5));if(c!=null){o=c;break}}
    maxo=Math.max(maxo,Math.abs(o));dots.push({s,x:X,o})});
  const cy=maxo+r+4,H=cy+maxo+r+26;dots.forEach(d=>d.y=cy+d.o);
  let ax=`<line x1="0" x2="${W}" y1="${H-20}" y2="${H-20}" stroke="var(--axis)"/>`,lx=-99;
  nice(lo,hi,W<560?3:6).forEach(v=>{const X=x(v);if(X-lx<56)return;lx=X;ax+=`<line x1="${X}" x2="${X}" y1="${H-20}" y2="${H-16}" stroke="var(--axis)"/><text class="tk" x="${X}" y="${H-4}" text-anchor="${X<24?'start':X>W-24?'end':'middle'}">${f$(v)}</text>`});
  strip.insertAdjacentHTML('afterbegin',`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="--c:${m.c}">${ax}`+
    dots.map(d=>`<circle class="dot${d.s.last.f?' res':''}${d.s.last.f===2?' out':''}${S.brand&&d.s.brand!==S.brand?' dim':''}" cx="${d.x.toFixed(1)}" cy="${d.y}" r="${r}"/>`).join('')+
    dots.filter(d=>d.s.k===S.sku||d.s.k===S.pre).map(d=>`<circle class="ring" cx="${d.x.toFixed(1)}" cy="${d.y}" r="${r+3.5}"${d.s.k===S.sku?'':' opacity=".45"'}/>`).join('')+`</svg>`);
}
function nearDot(e){const r=strip.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;let b=null,bd=20*20;
  dots.forEach(d=>{const q=(d.x-px)**2+(d.y-py)**2;if(q<bd){bd=q;b=d}});return b}
function setPre(k){if(S.pre===k)return;S.pre=k;draw(false);drawStrip()}
strip.addEventListener('pointermove',e=>{const d=nearDot(e);
  if(!d){tip2.classList.remove('show');setPre(null);return}
  setPre(d.s.k);tip2.innerHTML=`<div class="r" style="grid-template-columns:1fr auto"><span>${esc(d.s.name)}</span><b>${f$(d.s.last.v)}</b></div>${d.s.last.f?`<div class="s">${d.s.last.f===1?'限搭機':'缺貨／洽門市'}</div>`:''}`;
  tip2.classList.add('show');const tw=tip2.offsetWidth;tip2.style.left=clamp(d.x-tw/2,0,strip.clientWidth-tw)+'px';tip2.style.top=(d.y+16)+'px'});
strip.addEventListener('pointerleave',()=>{tip2.classList.remove('show');setPre(null)});
strip.addEventListener('click',e=>{const d=nearDot(e);if(d)pickSku(d.s.k===S.sku?null:d.s.k)});
rows.addEventListener('click',e=>{const b=e.target.closest('.row');if(b)pickSku(+b.dataset.k===S.sku?null:+b.dataset.k)});
rows.addEventListener('pointerover',e=>{const b=e.target.closest('.row');if(b&&e.pointerType==='mouse')setPre(+b.dataset.k)});
rows.addEventListener('pointerleave',()=>setPre(null));
filters.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.g)S.gone=!S.gone;else S.brand=b.dataset.b||null;renderSkus()});
function pickSku(k){S.sku=k;S.pre=null;renderHero();draw(false);renderSkus();
  if(k!=null&&box.getBoundingClientRect().top<0)$('.top').scrollIntoView({behavior:'smooth',block:'start'})}

addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey||/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  if(e.key==='Escape'){if(S.sku!=null)pickSku(null);else if(S.model)go(null);return}
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  const d=e.key==='ArrowRight'?1:-1,i=S.model?S.model.i+d:(d>0?0:M.length-1);
  e.preventDefault();go(M[i]||null);
});

/* ---------- shell ---------- */
function render(anim){syncLadder();syncRange();syncBasis();renderHero();draw(anim);renderSkus()}
$('#stamp').textContent=DATA.updated.replace(/-/g,'/');
$('#src').innerHTML=`<a href="https://www.coolpc.com.tw/evaluate.php" rel="noopener">原價屋</a> 歷史存檔 · ${DATA.snapshots+DATA.liveFetches} 份快照`;
$('#theme').addEventListener('click',()=>{
  const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  document.documentElement.dataset.theme=dark?'light':'dark';try{localStorage.setItem('rtx50-theme',document.documentElement.dataset.theme)}catch(e){}});
try{const t=localStorage.getItem('rtx50-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
let rw=0;new ResizeObserver(()=>{const w=box.clientWidth;if(w&&w!==rw){rw=w;draw(false);if(S.model)renderSkus()}}).observe(box);
S.model=M.find(x=>x.slug===location.hash.slice(1))||null;
renderLadder();
render(true);
})();
</script>
</body>
</html>
